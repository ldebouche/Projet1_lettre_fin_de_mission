<div class="login-page">
    <div class="login-card">
        <h2>Recherche dossier</h2>
        <p class="login-subtitle">Entre le SIRET pour retrouver l’entreprise.</p>

        <form [formGroup]="form" (ngSubmit)="onSearch()">
            <div *ngIf="errorMessage" class="error-formulaire">
                {{ errorMessage }}
            </div>

            <label>
                <span>SIRET</span>
                <input type="text" formControlName="siret" placeholder="55210055400013" inputmode="numeric" />
            </label>

            <div *ngIf="form.get('siret')?.invalid && form.get('siret')?.touched" class="error-formulaire">
                <ng-container *ngIf="form.get('siret')?.errors?.['required']">Le SIRET est requis</ng-container>
                <ng-container *ngIf="form.get('siret')?.errors?.['pattern']">Le SIRET doit contenir 14
                    chiffres</ng-container>
            </div>

            <div class="actions">
                <button class="btn" type="submit">Rechercher</button>
            </div>
        </form>
    </div>
</div>

<app-modal [isOpen]="isResultModalOpen" title="Confirmer le dossier" (closeEvent)="closeModal()">
    <div modal-body *ngIf="entrepriseTrouvee">
        <div class="entreprise-box">
            <div class="entreprise-name">{{ entrepriseTrouvee.nom }}</div>
            <div class="entreprise-sub">SIRET : {{ entrepriseTrouvee.siret }}</div>
            <div class="entreprise-sub">{{ entrepriseTrouvee.adresse }}</div>
        </div>
    </div>

    <div modal-footer class="modal-actions">
        <button class="btn secondary" type="button" (click)="onRetour()">Retour</button>
        <button class="btn" type="button" (click)="onValider()">Valider</button>
    </div>
</app-modal>
