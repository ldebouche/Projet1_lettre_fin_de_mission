<div class="login-page">
  <div class="login-card">
    <h2>{{ nomEntreprise }}</h2>
    <form (ngSubmit)="onSubmit()" [formGroup]="form">
      <div *ngIf="errorMessage" class="error-formulaire">
        {{ errorMessage }}
      </div>

      <label>
        <span>Code client</span>
        <input type="text" formControlName="code_client" class="readonly" />
      </label>

      <label>
        <span>Date de début d'exercice</span>
        <input type="date" formControlName="dateDebutEx" />
      </label>
      <div *ngIf="form.get('dateDebutEx')?.invalid && form.get('dateDebutEx')?.touched" class="error-formulaire">
        La date de début d'exercice est requise
      </div>

      <label>
        <span>Date de fin d'exercice</span>
        <input type="date" formControlName="dateFinEx" />
      </label>
      <div *ngIf="form.get('dateFinEx')?.invalid && form.get('dateFinEx')?.touched" class="error-formulaire">
        La date de fin d'exercice est requise
      </div>

      <div class="actions">
        <button class="btn" type="submit">Se connecter</button>
      </div>
    </form>
  </div>
</div>
