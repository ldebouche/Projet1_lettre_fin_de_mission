<div *ngIf="!loading">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="stack">

    <!-- ===== CHIFFRES CLÉS ===== -->
    <section-chiffres-cles [group]="f.CC" [infoChiffresCles]="infoChiffresCles" [anneeN1Existe]="anneeN1Existe"></section-chiffres-cles>

    <!-- ===== EVOLUTION CHARGES EXTERNES & AUTRES ACHATS ===== -->
    <section-evolution-charges-component [group]="f.EC"></section-evolution-charges-component>

    <!-- ===== CHARGES DE PERSONNEL ===== -->
    <section-charges-personnel-component [group]="f.CP"></section-charges-personnel-component>
    
    <!-- ===== INVESTISSEMENTS ===== -->
    <section-investissement-component [group]="f.I" [dotations]="dotations"></section-investissement-component>

    <!-- ===== IMPÔT SUR LES SOCIÉTÉS (TABLEAU) ===== -->
    <section-impot-societes-tab-component [group]="f.IS"></section-impot-societes-tab-component>

    <!-- ===== ACOMPTES IMPÔT SUR LES SOCIÉTÉS N+1 ===== -->
    <section-acompte-impot-component [group]="f.AI"  [moisCloture]="moisClotureArray"></section-acompte-impot-component>

    <!-- ===== INFORMATION FISCALE ===== -->
    <section-info-fiscale-component [formArray]="IF" [items]="informations_fiscales" ></section-info-fiscale-component>

    <!-- ===== PROJET D’AFFECTATION DU RÉSULTAT ===== -->
    <section-projet-affect-resultat-component [group]="f.PA" [affectation]="PA_affectation" [resEx]="resEx" ></section-projet-affect-resultat-component>

    <!-- ===== ESTIMATION D’AUTOFINANCEMENT SUR LA BASE D'UNE HYPOTHESE DE MAINTIEN DU RÉSULTAT ACTUEL ===== -->
    <section-estim-autofinancement-component [group]="f.EA" [resEx]="resEx" [dotation]="dotations[0]"></section-estim-autofinancement-component>

    <!-- ===== MISE A JOUR DU DOCUMENT UNIQUE D’EVALUATION DES RISQUES PROFESSIONNELS DE L’ENTREPRISE ===== -->
    <section-majdoc-unique-eval-component [group]="f.MD"></section-majdoc-unique-eval-component>

    <!-- ===== FAITS MARQUANTS ===== -->
    <section-faits-marquants-component [group]="f.FM"></section-faits-marquants-component>

    <!-- ===== LES PERSPECTIVES ===== -->
    <section-perspectives-component [group]="f.P"></section-perspectives-component>

    <!-- ===== SIGNATAIRE ===== -->
    <section-signataire-component [group]="f.S"></section-signataire-component>

    <div class="actions">
      <button class="btn" type="submit">Enregistrer</button>
    </div>
  </form>
</div>
