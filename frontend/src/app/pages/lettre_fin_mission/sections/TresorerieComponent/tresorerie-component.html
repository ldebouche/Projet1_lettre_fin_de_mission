<fieldset class="block" [formGroup]="group">
  <legend><span class="titre">TRESORERIE</span></legend>
  <table class="table">
    <thead>
      <tr>
        <th rowspan="2">Libellé</th>
        <th>Date début</th>
        <th>Date fin</th>
        <th>Montant emprunté</th>
        <th>Montant à payer</th>
      </tr>
    </thead>
    <tbody>
      <ng-container *ngFor="let emp of emprunts">
        <tr>
          <td class="first-row">{{ emp.T_designation }}</td>
          <td>{{ emp.T_date_debut }}</td>
          <td>{{ emp.T_date_fin }}</td>
          <td>{{ getValue(emp.T_montant_emprunt) }}</td>
          <td>{{ getValue(emp.T_montant_restant) }}</td>
        </tr>
      </ng-container>
    </tbody>
  </table>
</fieldset>
