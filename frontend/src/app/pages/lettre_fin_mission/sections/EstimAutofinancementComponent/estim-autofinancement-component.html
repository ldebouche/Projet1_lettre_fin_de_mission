<fieldset class="block" [formGroup]="group">
    <legend>
        <label class="clickable">
        <input type="checkbox" formControlName="enabled" />
        <span class="titre">ESTIMATION D’AUTOFINANCEMENT SUR LA BASE D’UNE HYPOTHESE DE MAINTIEN DU RESULTAT ACTUEL</span>
        </label>
    </legend>
    <table class="table">
        <thead>
        <tr>
            <th></th>
            <th>N+1</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td class="first-row">Résultat de l’exercice</td>
            <td>{{ getValue(group.get('resEx')?.value)}}</td>
        </tr>
        <tr>
            <td class="first-row">Dotations aux amortissements</td>
            <td>{{ getValue(group.get('dot')?.value) }}</td>
        </tr>
        <tr>
            <td class="first-row">Remboursements emprunts</td>
            <td>{{ getValue(group.get('rembours')?.value) }}</td>
        </tr>
        <tr>
            <td class="first-row">Dividendes</td>
            <td><input type="number" class="inputNumber" formControlName="divi" step="1" /></td>
        </tr>
        <tr class="row-capaAutof">
            <td class="first-row">= Capacité d’autofinancement net</td>
            <td>{{ getValue(capaAutfinance) }}</td>
        </tr>
        </tbody>
    </table>
</fieldset>
