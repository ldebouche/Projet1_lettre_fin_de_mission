<fieldset class="block" [formGroup]="group">
    <legend>
        <label class="clickable">
        <input type="checkbox" formControlName="enabled" />
        <span class="titre">ESTIMATION D’AUTOFINANCEMENT SUR LA BASE D’UNE HYPOTHESE DE MAINTIEN DU RESULTAT ACTUEL</span>
        </label>
    </legend>
    <table class="table">
        <thead>
        <tr>
            <th></th>
            <th>N+1</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td>Résultat de l’exercice</td>
            <td>{{ resEx | number:'1.0-0':'fr-FR' }}</td>
        </tr>
        <tr>
            <td>Dotations aux amortissements</td>
            <td><input type="number" class="inputNumber" formControlName="dot" step="1" /></td>
        </tr>
        <tr>
            <td>Remboursements emprunts</td>
            <td><input type="number" class="inputNumber" formControlName="rembours" step="1" /></td>
        </tr>
        <tr>
            <td>Dividendes</td>
            <td><input type="number" class="inputNumber" formControlName="divi" step="1" /></td>
        </tr>
        <tr class="row-capaAutof">
            <td>= Capacité d’autofinancement net</td>
            <td>{{ capaAutfinance | number:'1.0-0':'fr-FR' }}</td>
        </tr>
        </tbody>
    </table>
</fieldset>
