<fieldset class="block" [formGroup]="group">
  <legend>
    <span class="titre">CHARGES DE PERSONNEL</span>
  </legend>

  <table class="table">
    <thead>
      <tr>
        <th rowspan="2"></th>
        <th>N</th>
        <th *ngIf="anneeN1Existe">N-1</th>
        <th colspan="2" *ngIf="anneeN1Existe">Variation</th>
      </tr>
      <tr>
        <th>Valeur</th>
        <th *ngIf="anneeN1Existe">Valeur</th>
        <th *ngIf="anneeN1Existe">Valeur</th>
        <th *ngIf="anneeN1Existe">%</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let ind of indicateurs">
        <td class="first-row">{{ ind.label }}</td>

        <!-- Colonne N -->
        <td>
          <!-- Si c’est la ligne “heures rémunérées”, on affiche des inputs -->
          <ng-container *ngIf="ind.label === 'Nombre d\'heures rémunérées'; else valeurN">
            <input 
              type="number"
              formControlName="heuresRemunN"
              class="inputNumber"
              [attr.placeholder]="'Heures N'"
            />
          </ng-container>
          <ng-template #valeurN>
            {{ getValue(ind.keys.n) }}
          </ng-template>
        </td>

        <!-- Colonne N-1 -->
        <td *ngIf="anneeN1Existe">
          <ng-container *ngIf="ind.label === 'Nombre d\'heures rémunérées'; else valeurN1">
            <input 
              type="number"
              formControlName="heuresRemunN1"
              class="inputNumber"
              [attr.placeholder]="'Heures N-1'"
            />
          </ng-container>
          <ng-template #valeurN1>
            {{ getValue(ind.keys.n1) }}
          </ng-template>
        </td>

        <!-- Variation -->
        <td *ngIf="anneeN1Existe">{{ getValue(ind.keys.var) }}</td>
        <td *ngIf="anneeN1Existe">{{ getValue(ind.keys.pctVar, true) }}</td>
      </tr>
    </tbody>
  </table>

  <label class="checkline inline">
    <input type="checkbox" formControlName="annexeCotisationsEnabled" />
    <span>Annexe “Tableau des cotisations de travailleurs non-salariés provisionnelles pour l’année suivante”</span>
  </label>
</fieldset>
