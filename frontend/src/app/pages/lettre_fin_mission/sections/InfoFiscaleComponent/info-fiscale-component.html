<fieldset class="block" *ngIf="formArray && items.length">
  <legend class="titre">INFORMATION FISCALE</legend>

  <div class="checklist">
    <ng-container *ngFor="let ctrl of formArray.controls; let i = index">
      <label class="checkline" *ngIf="shouldDisplay(items[i])">
        <input type="checkbox" [formControl]="formArray.at(i)" />
        <span>{{ items[i] }}</span>
      </label>
    </ng-container>
  </div>
</fieldset>
