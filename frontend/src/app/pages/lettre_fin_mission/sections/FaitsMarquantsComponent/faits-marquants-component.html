<fieldset class="block" [formGroup]="group">
    <legend>
        <label class="clickable">
        <span class="titre">FAITS MARQUANTS DE L’EXERCICE</span>
        </label>
    </legend>
    <textarea 
        rows="4" 
        class="area"
        formControlName="commentaire">
    </textarea>
    <bouton-textarea class="reformuler"  buttonLabel="Reformuler" categorie="reformuler" [data]="data"></bouton-textarea>
    <label class="checkline">
        <input type="checkbox" formControlName="justificationsDemandes"/>
        <span>Nous avons pris bonne note des justifications apportées à nos demandes d’explications concernant les apports financiers effectués.</span>
    </label>
</fieldset>
