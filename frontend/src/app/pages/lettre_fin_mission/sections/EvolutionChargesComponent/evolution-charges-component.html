<fieldset class="block" [formGroup]="group">
    <legend>
      <label class="clickable">
        <input type="checkbox" formControlName="masquerSection" />
        <span class="titre">EVOLUTION DES CHARGES EXTERNES ET AUTRES ACHATS</span>
        <small class="note">(Cocher la case pour ne pas présenter cette partie dans la lettre de fin de mission)</small>
      </label>
    </legend>

    <div class="grid2">
      <label class="checkline">
        <span>Montant de variation minimum</span>
        <input type="number" step="0.01" class="inputNumber"
                formControlName="montantVariationMin">
      </label>
      <div [formGroup]="variation">
        <label class="checkline">
          <span>• Variation</span>
        </label>
        <bouton-textarea formControlName="commentaire"></bouton-textarea>
      </div>
    </div>
  </fieldset>
