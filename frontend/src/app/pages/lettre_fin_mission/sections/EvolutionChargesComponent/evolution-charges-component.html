<fieldset class="block" [formGroup]="group">
    <legend>
      <label class="clickable">
        <input type="checkbox" formControlName="masquerSection" />
        <span class="titre">EVOLUTION DES CHARGES EXTERNES ET AUTRES ACHATS</span>
        <small class="note">(Cocher la case pour ne pas présenter cette partie dans la lettre de fin de mission)</small>
      </label>
    </legend>

      <table class="table" >
        <tbody>
          <tr *ngIf="anneeN1Existe">
            <td>Montant de variation minimum</td>
            <td><input type="number" step="0.01" class="inputNumber" formControlName="montantVariationMin"></td>
          </tr>
          <tr *ngIf="anneeN1Existe">
            <td>Montant de variation minimum en pourcentage</td>
            <td><input type="number" step="0.01" class="inputNumber" formControlName="montantVariationMinPourcentage"></td>
          </tr>
          <tr>
            <td>Montant minimum à afficher</td>
            <td><input type="number" step="0.01" class="inputNumber" formControlName="montantMinAffiché"></td>
          </tr>
        </tbody>
      </table>
      <div *ngIf="anneeN1Existe">
        <label class="checkline">
          <span>• Variation</span>
        </label>
        <bouton-textarea formControlName="commentaire"></bouton-textarea>
      </div>

  </fieldset>
