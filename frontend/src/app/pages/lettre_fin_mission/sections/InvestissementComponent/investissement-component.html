<fieldset class="block" [formGroup]="group" *ngIf="group">
    <legend>
        <label class="clickable">
        <input type="checkbox" formControlName="masquerSection" />
        <span class="titre">INVESTISSEMENTS</span>
        </label>
    </legend>
  <table class="table" *ngIf="dotations.length">
    <thead>
      <tr>
        <th></th>
        <th class="col-n">N</th>
        <th class="col-n1">N+1</th>
        <th class="col-n2">N+2</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="first-row">Dotations aux amortisssements</td>
        <td>{{ dotations[0] | number:'1.0-0':'fr-FR' }}</td>
        <td>{{ dotations[1] | number:'1.0-0':'fr-FR' }}</td>
        <td>{{ dotations[2] | number:'1.0-0':'fr-FR' }}</td>
      </tr>
    </tbody>
  </table>
  
  <div class="commentaire-section">
    <label for="investissement-commentaire">Commentaire</label>
    <textarea 
      id="investissement-commentaire"
      rows="4" 
      class="area"
      formControlName="commentaire"
      placeholder="Entrez votre commentaire...">
    </textarea>
    <div class="boutons-commentaire">
      <bouton-textarea formControlName="commentaire" categorie="investissement" [data]="group.get('commentaire')" [immobs]="immobs" (tableauInvestissement)="group.get('tableau')?.setValue($event)" [hideOwnTextarea]="true" *ngIf="immobs"></bouton-textarea>
      <bouton-textarea class="reformuler" formControlName="commentaire" buttonLabel="Reformuler" categorie="reformuler" [data]="group.get('commentaire')"></bouton-textarea>
    </div>
  </div>
</fieldset>
