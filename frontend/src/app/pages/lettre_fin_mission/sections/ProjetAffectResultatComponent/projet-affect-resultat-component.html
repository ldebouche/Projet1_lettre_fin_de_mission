<fieldset class="block" [formGroup]="group">
    <legend class="titre">PROJET D’AFFECTATION DU RESULTAT</legend>
    <table class="table">
        <thead>
        <tr>
            <th></th>
            <th>N</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td>Résultat de l’exercice</td>
            <td>{{ resEx | number: '1.2-2' }}</td>
        </tr>
        <tr class="row-affectations">
            <td colspan="2">Affectations</td>
        </tr>
        <tr>
            <td>Réserve légale</td>
            <td><input type="number" class="inputNumber" formControlName="reserveLegale" step="0.01" /></td>
        </tr>
        <tr>
            <td>Réserve ordinaire</td>
            <td><input type="number" class="inputNumber" formControlName="reserveOrdinaire" step="0.01" /></td>
        </tr>
        <tr>
            <td>Report à nouveau</td>
            <td><input type="number" class="inputNumber" formControlName="reportNouveau" step="0.01" /></td>
        </tr>
        <tr>
            <td>fonds associatifs</td>
            <td><input type="number" class="inputNumber" formControlName="dividendes" step="0.01" /></td>
        </tr>
        </tbody>
    </table>
</fieldset>
