<div class="chatbot-manager-page">

    <header class="manager-header">
        <h2>Gestion de la Base de Connaissances du Chatbot</h2>
    </header>

    <div class="manager-layout">

        <app-sidebar-tree class="sidebar" [indexedItems]="indexedItems" [dateSortOrder]="dateSortOrder"
            [iconDossier]="iconDossier" [iconFichier]="iconFichier" [isItemVisibleFn]="isItemVisible.bind(this)"
            [getItemDepthFn]="getItemDepth.bind(this)" [hasChildrenFn]="hasChildren.bind(this)" [loading]="loading_tree"
            (createFolder)="createNewFolder($event)" (deleteItem)="confirmDelete($event)"
            (toggleFolder)="toggleFolder($event)" (toggleSortByDate)="toggleSortByDate()"
            (openSearch)="openSearchModal()" (editItem)="confirmEdit($event)">
        </app-sidebar-tree>

        <main class="content-panel">
            <section class="upload-card">
                <legend>Ajouter et indexer de nouveaux documents</legend>

                <div class="tabs-nav">
                    <button class="tab-btn" [class.active]="activeTab === 'upload'" (click)="setTab('upload')">
                        Fichier local
                    </button>
                    <button class="tab-btn" [class.active]="activeTab === 'link'" (click)="setTab('link')">
                        Lien externe
                    </button>
                    <button class="tab-btn" [class.active]="activeTab === 'verif'" (click)="setTab('verif')">
                        Fichiers en attente de vérification ({{ compteurFichiersVerif }})
                    </button>
                    <button class="tab-btn" [class.active]="activeTab === 'index'" (click)="setTab('index')">
                        Fichiers en attente d'indexation ({{ compteurFichiersIndex }})
                    </button>
                </div>

                <app-tab-upload-local *ngIf="activeTab === 'upload'" [iconExportation]="iconExportation"
                    [iconFichier]="iconFichier" (created)="getCompteursFichiers()"
                    (processingStart)="startProcessing($event.title, $event.message)"
                    (processingEnd)="endProcessing($event.title, $event.message)">
                </app-tab-upload-local>

                <app-tab-lien-externe *ngIf="activeTab === 'link'" (created)="getCompteursFichiers()"
                    (processingStart)="startProcessing($event.title, $event.message)"
                    (processingEnd)="endProcessing($event.title, $event.message)">
                </app-tab-lien-externe>

                <app-tab-verification *ngIf="activeTab === 'verif'" (updated)="onVerificationUpdated()">
                </app-tab-verification>

                <app-tab-indexation *ngIf="activeTab === 'index'" [iconFichier]="iconFichier"
                    [indexedItems]="indexedItems" (filesToUploadChange)="filesToUpload = $event"
                    [getIndentationForSelect]="getIndentationForSelect.bind(this)"
                    [compareFolders]="compareFolders.bind(this)" (indexed)="getTree()"
                    [actualiserIndexation]="actualiserIndexation"
                    (processingStart)="startProcessing($event.title, $event.message)"
                    (processingEnd)="endProcessing($event.title, $event.message)">
                </app-tab-indexation>
            </section>
        </main>
    </div>

    <app-modal *ngIf="isModalOpen && modalConfig" [isOpen]="isModalOpen" [title]="modalConfig.title"
        (closeEvent)="closeModal()">
        <div modal-body>
            <div *ngIf="isProcessing" class="modal-loading-state">
                <div class="spinner"></div>
                <p class="modal-message">{{ modalConfig.message }}</p>
            </div>

            <div *ngIf="!isProcessing">
                <p class="modal-message" *ngIf="modalConfig.message">{{ modalConfig.message }}</p>
                <div *ngIf="modalConfig.type === 'prompt'" class="modal-prompt-wrapper">
                    <input type="text" [(ngModel)]="modalInputValue" class="modal-input"
                        placeholder="Saisissez un nom..." (keyup.enter)="confirmModal()" />
                </div>
                <div *ngIf="modalConfig.type === 'search'" class="modal-prompt-wrapper">
                    <input type="text" [(ngModel)]="searchQuery" class="modal-input" placeholder="Nom, date…"
                        (input)="updateSearchResults()" />

                    <ul class="search-list">
                        <li *ngFor="let f of searchResults clickable" class="search-item" (click)="openFileFromSearch(f)">
                            <div class="search-left">
                                <div class="search-meta">
                                    <span>{{ f.importedAt | date:'short' }}</span>
                                    <span>•</span>
                                    <span class="search-name">{{ f.name }}</span>
                                </div>
                            </div>
                        </li>

                        <li *ngIf="searchResults.length === 0" class="search-empty">
                            Aucun résultat.
                        </li>
                    </ul>

                </div>
            </div>
        </div>

        <div modal-footer class="modal-footer-layout">
            <button class="btn secondary" (click)="closeModal()" [disabled]="isProcessing">
                {{ modalConfig.cancelButtonText || 'Annuler' }}
            </button>

            <button *ngIf="modalConfig.type !== 'alert'" class="btn" (click)="confirmModal()"
                [disabled]="modalConfig.type === 'prompt' && !modalInputValue.trim()">
                {{ modalConfig.confirmButtonText || 'Confirmer' }}
            </button>
        </div>
    </app-modal>
</div>
