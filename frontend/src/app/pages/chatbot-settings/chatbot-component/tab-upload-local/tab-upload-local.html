<div class="tab-content">
    <div class="upload-dropzone" (dragover)="onDragOver($event)" (dragleave)="onDragLeave($event)"
        (drop)="onFileDrop($event)">

        <img class="dropzone-icon" [src]="iconExportation" alt="Uploader des fichiers" />
        <p>Glissez-déposez vos fichiers (PDF),<br /> ou cliquez pour sélectionner.</p>

        <input type="file" id="file-upload" multiple class="hidden-input" (change)="onFileSelected($event)" />

        <label for="file-upload" class="upload-label">Choisir des fichiers</label>
    </div>

    <h4>Fichiers en attente d'ajout ({{ filesToUpload.length }})</h4>

    <ul class="file-list-status">
        <li *ngFor="let file of filesToUpload" class="status-item">
            <div class="item-label">
                <img class="tree-icon" [src]="iconFichier" alt="Icône de fichier" />
                <span class="file-name">{{ file.name }}</span>
                <span class="file-size">
                    ({{ (file.size / 1024 / 1024) | number:'1.2-2' }} MB)
                </span>
            </div>

            <button class="item-action delete-action" title="Retirer" (click)="removeFile(file)">
                &times;
            </button>
        </li>

        <li *ngIf="filesToUpload.length === 0" class="status-item empty">
            Aucun fichier en attente.
        </li>
    </ul>

    <div class="link-actions">
        <button class="btn" [disabled]="filesToUpload.length === 0" (click)="submit()">
            Lancer l'ajout des fichiers
        </button>
    </div>
</div>
