<app-lab-carte class="wizard-card form-section" id="section-kyc" title="KYC structuré">
  <div class="form-grid form-grid--2">
    <label class="field">
      <span class="field-label">Catégorie client</span>
      <select class="field-input" name="kyc_cat" [(ngModel)]="m.kyc.categorie_client">
        <option value="">—</option>
        <option value="Personne_morale">Personne morale</option>
        <option value="Personne_physique">Personne physique</option>
      </select>
    </label>
    <label class="field" *ngIf="m.kyc.categorie_client === 'Personne_physique'">
      <span class="field-label">Civilité</span>
      <select class="field-input" name="kyc_civ" [(ngModel)]="m.kyc.civilite">
        <option value="">—</option>
        <option value="M.">M.</option>
        <option value="Mme">Mme</option>
        <option value="Autre">Autre</option>
      </select>
    </label>
    <label class="field" *ngIf="m.kyc.categorie_client === 'Personne_physique'">
      <span class="field-label">Nom</span>
      <input class="field-input" type="text" name="kyc_nom_pp" [(ngModel)]="m.kyc.nom_physique" />
    </label>
    <label class="field" *ngIf="m.kyc.categorie_client === 'Personne_physique'">
      <span class="field-label">Prénom</span>
      <input class="field-input" type="text" name="kyc_prenom_pp" [(ngModel)]="m.kyc.prenom_physique" />
    </label>
    <label class="field">
      <span class="field-label">Pays résidence fiscale</span>
      <select class="field-input" name="kyc_pays_fisc" [(ngModel)]="m.kyc.pays_residence_fiscale">
        <option value="">—</option>
        <option *ngFor="let p of paysIsoOptions" [value]="p.libelle">{{ p.libelle }}</option>
      </select>
    </label>
    <label class="field">
      <span class="field-label">Pays implantation principale</span>
      <select class="field-input" name="kyc_pays_imp" [(ngModel)]="m.kyc.pays_implantation">
        <option value="">—</option>
        <option *ngFor="let p of paysIsoOptions" [value]="p.libelle">{{ p.libelle }}</option>
      </select>
      <app-lab-wizard-field-meta [meta]="getFieldMeta('kyc.pays_implantation')" (acceptApi)="acceptApi.emit('kyc.pays_implantation')" />
    </label>
    <label class="field field--full">
      <span class="field-label">Pays / zones à risque (LCB‑FT)</span>
      <select
        class="field-input field-select--multi"
        name="kyc_pays_risque"
        multiple
        [ngModel]="paysRisqueSelected"
        (ngModelChange)="onPaysRisqueChange($event)"
        size="6"
      >
        <option *ngFor="let p of paysRisqueOptions" [value]="p.libelle">
          {{ p.libelle }} ({{ p.liste === 'PAYS_D3-2' ? 'D3-2' : 'D3-1' }})
        </option>
      </select>
      <span class="field-hint">Listes D3-1 / D3-2 (trame CNOEC). Ctrl+clic pour multi-sélection. Valeur conservée pour cartographie / requêtes.</span>
    </label>
    <label class="field field--full">
      <span class="field-label">Secteurs d’activité (liste ou précisions)</span>
      <textarea class="field-input field-textarea" name="kyc_secteurs" rows="3" [(ngModel)]="m.kyc.secteurs_text"></textarea>
      <app-lab-wizard-field-meta [meta]="getFieldMeta('kyc.secteurs_text')" (acceptApi)="acceptApi.emit('kyc.secteurs_text')" />
    </label>
    <label class="check field--full check--solo">
      <input type="checkbox" name="kyc_secteur_sensible" [(ngModel)]="m.kyc.secteur_sensible" />
      <span>Secteur sensible (liste cabinet / réglementaire)</span>
    </label>
    <label class="field">
      <span class="field-label">Statut PEP</span>
      <select class="field-input" name="kyc_pep" [(ngModel)]="m.kyc.pep_statut">
        <option value="">—</option>
        <option value="Oui">Oui</option>
        <option value="Non">Non</option>
        <option value="Inconnu">Inconnu</option>
      </select>
    </label>
    <label class="field field--full">
      <span class="field-label">Détails PEP / lien PEP</span>
      <textarea class="field-input field-textarea" name="kyc_pep_det" rows="2" [(ngModel)]="m.kyc.pep_details"></textarea>
    </label>
    <label class="field">
      <span class="field-label">Origine des fonds / richesse</span>
      <select
        class="field-input"
        name="kyc_origine_statut"
        [(ngModel)]="m.kyc.origine_fonds_statut"
        (ngModelChange)="onOrigineFondsStatutChange($event)"
      >
        <option value="">—</option>
        <option value="Non_applicable">Non requise</option>
        <option value="A_renseigner">À renseigner</option>
        <option value="Renseignee">Renseignée</option>
      </select>
    </label>
    <label class="field">
      <span class="field-label">Complexité structure juridique</span>
      <select class="field-input" name="kyc_complex" [(ngModel)]="m.kyc.complexite_structure">
        <option value="">—</option>
        <option value="Simple">Simple</option>
        <option value="Moyenne">Moyenne</option>
        <option value="Complexe">Complexe</option>
        <option value="Inconnue">Inconnue</option>
      </select>
    </label>
    <label class="field field--full">
      <span class="field-label">Justification complexité</span>
      <textarea class="field-input field-textarea" name="kyc_just_complex" rows="2" [(ngModel)]="m.kyc.justification_complexite"></textarea>
    </label>
    <label class="field">
      <span class="field-label">Exposition sanctions / gel des avoirs</span>
      <select class="field-input" name="kyc_sanctions" [(ngModel)]="m.kyc.exposition_sanctions">
        <option value="">—</option>
        <option value="Oui">Oui</option>
        <option value="Non">Non</option>
        <option value="Inconnu">Inconnu</option>
      </select>
      <span class="field-hint">
        Vérifier sur le
        <a
          href="https://gels-avoirs.dgtresor.gouv.fr/List"
          target="_blank"
          rel="noopener noreferrer"
        >registre national des gels (DG Trésor)</a>
        puis consigner le résultat.
      </span>
    </label>
    <label class="field field--full">
      <span class="field-label">Notes internes KYC</span>
      <textarea class="field-input field-textarea" name="kyc_notes" rows="4" [(ngModel)]="m.kyc.notes"></textarea>
    </label>
  </div>
</app-lab-carte>
