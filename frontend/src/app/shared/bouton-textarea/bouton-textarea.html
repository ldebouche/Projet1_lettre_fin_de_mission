<div *ngIf="categorie === 'reformuler'">
  <button 
    type="button"
    class="btn"
    [disabled]="disabled || loading"
    (click)="handleClick(categorie)">
    {{ loading ? 'Reformulation en cours…' : buttonLabel }}
  </button>
</div>

<div *ngIf="categorie !== 'reformuler'">
  <div *ngIf="!showTextarea || hideOwnTextarea">
    <button 
      type="button"
      class="btn"
      [disabled]="disabled || loading"
      (click)="handleClick(categorie)">
      {{ loading ? 'Génération en cours…' : buttonLabel }}
    </button>
  </div>

  <div *ngIf="showTextarea && !hideOwnTextarea">
    <textarea 
      rows="4" 
      class="area"
      [value]="value"
      (input)="handleInput(($any($event.target)).value)"
      (blur)="handleBlur()">
    </textarea>
    <div class="reformuler">
      <button
        type="button"
        class="btn"
        [disabled]="disabled || loading"
        (click)="handleClick('reformuler')">
        {{ loading ? 'Reformulation en cours…' : 'Reformuler' }}
      </button>
    </div>
  </div>
</div>
