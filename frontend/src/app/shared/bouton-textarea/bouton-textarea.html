<div class="btn-to-textarea" [class.is-disabled]="disabled">
  <button
    *ngIf="!showTextarea"
    type="button"
    class="btn"
    (click)="handleClick()"
    [disabled]="disabled">
    {{ buttonLabel }}
  </button>

  <textarea
    *ngIf="showTextarea"
    class="area"
    [disabled]="disabled"
    [value]="value"
    (input)="handleInput(($any($event.target)).value)"
    (blur)="handleBlur()"
    rows="4">
  </textarea>
</div>
