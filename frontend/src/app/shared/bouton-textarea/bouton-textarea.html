<div *ngIf="!showTextarea">
  <button 
    type="button"
    class="btn"
    [disabled]="disabled || loading"
    (click)="handleClick(selector)">
    {{ loading ? 'Génération en cours…' : buttonLabel }}
  </button>
</div>

<div *ngIf="showTextarea">
  <textarea 
    rows="4" 
    class="area"
    [value]="value"
    (input)="handleInput(($any($event.target)).value)"
    (blur)="handleBlur()">
  </textarea>
</div>
