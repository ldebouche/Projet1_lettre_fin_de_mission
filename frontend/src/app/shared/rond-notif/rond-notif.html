<span *ngIf="!hidden" class="badge" [style.width.px]="size" [style.height.px]="size" [style.background]="bgColorStyle"
    [style.color]="textColor" [style.top]="top" [style.right]="right" [style.bottom]="bottom" [style.left]="left"
    [style.transform]="'translate(' + translateX + ',' + translateY + ')'">
    {{ display }}
</span>
