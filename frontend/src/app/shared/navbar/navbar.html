<nav class="navbar" [class.is-open]="adminMenuOpen">
  <div class="container">
    <div class="left">
      <button (click)="handleReturn()" class="nav-btn" *ngIf="currentUrl !== '/'">
        Retour
      </button>
    </div>

    <div class="center">
      <a routerLink="/accueil-intranet" class="logo-link" aria-label="Accueil">
        <div class="logo-wrap" [class.is-open]="adminMenuOpen"></div>
      </a>
    </div>

    <div class="right">
      <button (click)="logout()" class="nav-btn">Déconnexion</button>

      <button *ngIf="hasRole" class="hamburger" (click)="toggleAdminMenu()" [attr.aria-expanded]="adminMenuOpen"
        aria-label="Menu admin">
        <span *ngIf="!adminMenuOpen">☰</span>
        <span *ngIf="adminMenuOpen">✕</span>
      </button>
    </div>
  </div>

  <div class="backdrop" [class.open]="adminMenuOpen" (click)="closeAdminMenu()" aria-hidden="true"></div>

  <div class="admin-dropdown" [class.open]="adminMenuOpen" [attr.aria-hidden]="!adminMenuOpen">
    <div class="dropdown-inner">

      <div class="col">
        <div class="col-title">Gestion d’outils</div>

        <a class="dd-link" [routerLink]="['/chatbot-settings']" routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }" (click)="closeAdminMenu()">
          Gestion Chatbot
        </a>

        <a class="dd-link" [routerLink]="['/ana-secto-settings']" routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }" (click)="closeAdminMenu()">
          Gestion Analyses Sectorielles
        </a>
      </div>

      <div class="col">
        <div class="col-title">Comptes rendus</div>

        <a class="dd-link" [routerLink]="['/pilotage-equipe']" routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }" (click)="closeAdminMenu()">
          Pilotage équipe
        </a>
      </div>

    </div>
  </div>
</nav>
